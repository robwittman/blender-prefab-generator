[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "prefabgen"
version = "0.1.0"
description = "Generate a library of modular game-asset prefabs from a config file, using Blender headlessly"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pyyaml>=5.1"]

[project.scripts]
prefabgen = "prefabgen.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["prefabgen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
