include: common.yaml

library:
  name: Core Roof Kit
  version: "0.1.0"

output:
  manifest: manifest-roofs.json

materials:
  shingle_ceramic:
    display_name: Ceramic Shingle
    dir: shingle_ceramic
    maps:
      albedo: roof_07_diff_4k.jpg
      ao: roof_07_ao_4k.jpg
      normal: roof_07_nor_gl_4k.jpg
      roughness: roof_07_rough_4k.jpg
      height: roof_07_disp_4k.jpg
  reed:
    display_name: Reed
    dir: reed
    maps:
      albedo: reed_roof_04_diff_4k.jpg
      ao: reed_roof_04_ao_4k.jpg
      normal: reed_roof_04_nor_gl_4k.jpg
      roughness: reed_roof_04_rough_4k.jpg
      height: reed_roof_04_disp_4k.jpg


# `pitches` comes from common.yaml - the same two entries the gables in walls.yaml use,
# which is the whole point of naming them. `roof.pitches:` still works for a roof-only
# angle no other piece has to meet.

# `defaults.roof` in common.yaml carries the slab thickness and origin.

parts:
  # Slabs tile a square plan grid: span runs along the eave, run is horizontal depth
  # up the slope. The sloped panel is longer than its run by 1/cos(pitch), which is
  # what "accounting for the angle" buys you - the footprint still matches the walls.
  - type: roof
    piece: slab
    category: Roofs
    tags: [roof, modular]
    id_template: "{type}.{piece}.{span_mm}x{run_mm}.{pitch}.{material}"
    name: "roof_slab_{span}x{run}_{pitch}_{material}"
    display_name: "{material} roof slab {span}x{run} ({pitch})"
    matrix:
      span:     [1, 2, 4]
      run:      [1, 2]
      pitch:    [shallow, steep]
      material: [shingle_ceramic, reed]

  # Ridge cap. Its cross-section angle is derived from the pitch, so a shallow ridge
  # opens to 126.87 deg and a steep one to 90 deg.
  - type: roof
    piece: ridge
    category: Roofs
    tags: [roof, modular, trim]
    id_template: "{type}.{piece}.{span_mm}.{pitch}.{material}"
    name: "roof_ridge_{span}_{pitch}_{material}"
    display_name: "{material} ridge {span} ({pitch})"
    matrix:
      span:     [1, 2, 4]
      pitch:    [shallow, steep]
      material: [shingle_ceramic, reed]

  # Outside corner: two roof planes mitred along the diagonal, surface z = min(x,y)*tan.
  - type: roof
    piece: hip
    category: Roofs
    tags: [roof, modular, corner]
    id_template: "{type}.{piece}.{run_mm}.{pitch}.{material}"
    name: "roof_hip_{run}_{pitch}_{material}"
    display_name: "{material} hip corner {run} ({pitch})"
    matrix:
      run:      [1, 2]
      pitch:    [shallow, steep]
      material: [shingle_ceramic, reed]

  # Inside corner: surface z = max(x,y)*tan, diagonal is the low line.
  - type: roof
    piece: valley
    category: Roofs
    tags: [roof, modular, corner]
    id_template: "{type}.{piece}.{run_mm}.{pitch}.{material}"
    name: "roof_valley_{run}_{pitch}_{material}"
    display_name: "{material} valley corner {run} ({pitch})"
    matrix:
      run:      [1, 2]
      pitch:    [shallow, steep]
      material: [shingle_ceramic, reed]

  # Trim caps that sit over a mitred corner, for creators who want the raised detail.
  - type: roof
    piece: hip_cap
    category: Roofs
    tags: [roof, modular, trim]
    id_template: "{type}.{piece}.{run_mm}.{pitch}.{material}"
    name: "roof_hipcap_{run}_{pitch}_{material}"
    display_name: "{material} hip cap {run} ({pitch})"
    matrix:
      run:      [1, 2]
      pitch:    [shallow, steep]
      material: [shingle_ceramic, reed]

  - type: roof
    piece: valley_cap
    category: Roofs
    tags: [roof, modular, trim]
    id_template: "{type}.{piece}.{run_mm}.{pitch}.{material}"
    name: "roof_valleycap_{run}_{pitch}_{material}"
    display_name: "{material} valley cap {run} ({pitch})"
    matrix:
      run:      [1, 2]
      pitch:    [shallow, steep]
      material: [shingle_ceramic, reed]
